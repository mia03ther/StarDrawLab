resolver 127.0.0.11 valid=10s ipv6=off;

# Trust only the Docker bridge carrying the public reverse proxy. This lets
# the per-IP limits use the real client address from X-Forwarded-For without
# allowing arbitrary callers to spoof it directly to this container.
set_real_ip_from 172.18.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep normal browsing and recording responsive while bounding request and
# connection bursts before they consume API/database slots.
limit_req_zone $binary_remote_addr zone=stardraw_api_rate:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=stardraw_api_conn:10m;

# Nginx 1.27 can refresh service addresses through Docker DNS. The shared
# zone is required for runtime re-resolution after an API container replacement.
upstream stardraw_api {
    zone stardraw_api 64k;
    server api:5000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 220m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The SPA entry point must always be revalidated so a newly deployed
    # release cannot be hidden behind an old browser/proxy copy. Hashed assets
    # below remain immutable and keep their one-year cache policy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # OSS 代理：历史 content URL 仍是 /oss-proxy/...，统一转给后端签名代理。
    # 避免浏览器直接访问私有 Bucket 导致 403。
    location /oss-proxy/ {
        proxy_pass         http://stardraw_api/api/proxy/oss/;
        # resource_token is a five-minute bearer credential in the query
        # string; do not persist it in nginx access logs.
        access_log         off;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Preserve the API's per-resource Cache-Control policy. Private grants
        # are `private, no-store`; approved public template previews may cache.
        proxy_cache        off;
        expires            off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        limit_req zone=stardraw_api_rate burst=80 nodelay;
        limit_conn stardraw_api_conn 80;
        limit_req_status 429;

        proxy_pass         http://stardraw_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_next_upstream off;
        proxy_buffering off;
        client_max_body_size 220m;
    }

    # Liveness is intentionally separate from readiness. /ready reaches the
    # API's database-aware readiness handler instead of aliasing /health.
    location = /health {
        proxy_pass         http://stardraw_api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass         http://stardraw_api/ready;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Used only by the web container healthcheck. Public callers receive 403.
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }
}
